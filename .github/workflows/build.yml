name: Build Cat Client

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Fabric mod
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cat-client-mod
          path: build/libs/astral-cat-client-*.jar
          if-no-files-found: error
          retention-days: 14

  build-launcher:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher/package.json
      - name: Install launcher dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload Cat Client installer
        uses: actions/upload-artifact@v4
        with:
          name: cat-client-windows-launcher
          path: launcher/dist/*.exe
          if-no-files-found: error
          retention-days: 14
